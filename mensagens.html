<html lang="pt-BR">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  :root {
    --bg: #06101e;
    --card: #0b1829;
    --border: #152a42;
    --primary: #00c8a0;
    --blue: #0066cc;
    --text: #deeaf8;
    --muted: #3d6a8a;
    --danger: #e05252;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
  }

  .logo-bar {
    width: 100%;
    max-width: 480px;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 28px;
  }

  .logo-bar img { height: 36px; }

  .logo-bar span {
    font-size: 13px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }

  h1 {
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 6px;
    text-align: center;
  }

  .subtitle {
    font-size: 14px;
    color: var(--muted);
    text-align: center;
    margin-bottom: 28px;
  }

  .perfil-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(0, 200, 160, 0.12);
    border: 1px solid rgba(0, 200, 160, 0.3);
    border-radius: 20px;
    padding: 4px 14px;
    font-size: 13px;
    color: var(--primary);
    margin-bottom: 24px;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 24px;
    width: 100%;
    max-width: 480px;
    margin-bottom: 16px;
  }

  .card h2 {
    font-size: 15px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 16px;
  }

  .field { margin-bottom: 18px; }

  .field label {
    display: block;
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .field select,
  .field textarea,
  .field input {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text);
    font-size: 14px;
    padding: 10px 14px;
    outline: none;
    transition: border-color 0.2s;
    font-family: inherit;
  }

  .field select:focus,
  .field textarea:focus,
  .field input:focus {
    border-color: var(--primary);
  }

  .field textarea {
    resize: vertical;
    min-height: 80px;
  }

  .seg-group {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  .seg-btn {
    flex: 1;
    min-width: 80px;
    padding: 9px 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--muted);
    font-size: 13px;
    cursor: pointer;
    text-align: center;
    transition: all 0.15s;
    user-select: none;
  }

  .seg-btn.active {
    border-color: var(--primary);
    background: rgba(0, 200, 160, 0.1);
    color: var(--primary);
  }

  .btn-gerar {
    width: 100%;
    max-width: 480px;
    padding: 16px;
    border-radius: 14px;
    border: none;
    background: linear-gradient(135deg, var(--primary), #00a882);
    color: #06101e;
    font-size: 16px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    margin-bottom: 24px;
  }

  .btn-gerar:hover { opacity: 0.92; }
  .btn-gerar:active { transform: scale(0.98); }
  .btn-gerar:disabled { opacity: 0.5; cursor: not-allowed; }

  .resultado {
    width: 100%;
    max-width: 480px;
    display: none;
  }

  .resultado.visivel { display: block; }

  .msg-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 12px;
    position: relative;
  }

  .msg-texto {
    font-size: 16px;
    line-height: 1.6;
    color: var(--text);
    margin-bottom: 14px;
    white-space: pre-wrap;
  }

  .msg-meta {
    border-top: 1px solid var(--border);
    padding-top: 12px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .msg-meta .tag {
    font-size: 12px;
    color: var(--muted);
  }

  .msg-meta .tag span {
    color: var(--primary);
    font-weight: 500;
  }

  .btn-copiar {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--primary);
    background: transparent;
    color: var(--primary);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 14px;
    transition: background 0.15s;
  }

  .btn-copiar:hover { background: rgba(0, 200, 160, 0.08); }
  .btn-copiar.copiado { border-color: #00c8a0; color: #00c8a0; }

  .btn-nova {
    width: 100%;
    max-width: 480px;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
    margin-bottom: 8px;
    transition: border-color 0.15s, color 0.15s;
  }

  .btn-nova:hover { border-color: var(--muted); color: var(--text); }

  .loading {
    text-align: center;
    padding: 32px;
    color: var(--muted);
    font-size: 14px;
    display: none;
  }

  .loading.visivel { display: block; }

  .spinner {
    width: 32px;
    height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 12px;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .erro {
    background: rgba(224, 82, 82, 0.1);
    border: 1px solid rgba(224, 82, 82, 0.3);
    border-radius: 12px;
    padding: 14px;
    font-size: 14px;
    color: var(--danger);
    display: none;
    width: 100%;
    max-width: 480px;
    margin-bottom: 16px;
  }

  .erro.visivel { display: block; }

  @media (max-width: 400px) {
    .seg-btn { min-width: 60px; font-size: 12px; }
  }
</style>
</head>
<body>

<div class="logo-bar">
  <img src="logo.png" alt="Breno Carrera" onerror="this.style.display='none'">
  <span>App de Mensagens</span>
</div>

<h1>Gere a mensagem certa</h1>
<p class="subtitle">Cole o contexto — a IA monta a mensagem por você.</p>

<div class="perfil-badge" id="perfilBadge">
  ⚡ Perfil ADICAS: <strong id="perfilTexto">—</strong>
</div>

<!-- Formulário -->
<div class="card">
  <h2>Situação</h2>

  <div class="field">
    <label>Fase da conversa</label>
    <div class="seg-group" id="faseGroup">
      <div class="seg-btn active" data-val="abridor">1ª Mensagem</div>
      <div class="seg-btn" data-val="meio">No meio</div>
      <div class="seg-btn" data-val="fechamento">Chamar para sair</div>
    </div>
  </div>

  <div class="field">
    <label>Tom desejado</label>
    <div class="seg-group" id="tomGroup">
      <div class="seg-btn active" data-val="humor">Humor</div>
      <div class="seg-btn" data-val="direto">Direto</div>
      <div class="seg-btn" data-val="provocador">Provocador</div>
    </div>
  </div>

  <div class="field">
    <label>Contexto dela (esporte, trabalho, hobby…)</label>
    <input type="text" id="contexto" placeholder="Ex: ela faz yoga e adora viagens" maxlength="200">
  </div>

  <div class="field">
    <label>Cole um trecho da conversa (opcional)</label>
    <textarea id="trecho" placeholder="Cole aqui as últimas mensagens trocadas…" maxlength="800"></textarea>
  </div>
</div>

<button class="btn-gerar" id="btnGerar" onclick="gerarMensagem()">Gerar mensagem ✦</button>

<div class="loading" id="loading">
  <div class="spinner"></div>
  Analisando o contexto…
</div>

<div class="erro" id="erro"></div>

<div class="resultado" id="resultado">
  <div class="msg-card">
    <div class="msg-texto" id="msgTexto"></div>
    <div class="msg-meta">
      <div class="tag">Estrutura: <span id="msgEstrutura"></span></div>
      <div class="tag">Por que funciona: <span id="msgMotivo"></span></div>
    </div>
    <button class="btn-copiar" id="btnCopiar" onclick="copiarMensagem()">Copiar mensagem</button>
  </div>

  <button class="btn-nova" onclick="resetar()">← Gerar outra</button>
</div>

<script>
  // Lê perfil ADICAS salvo pelo quiz
  const perfilAdicas = localStorage.getItem('perfil_adicas') || 'CA';
  document.getElementById('perfilTexto').textContent = perfilAdicas;

  // Segmented controls
  function setupSeg(groupId) {
    const btns = document.querySelectorAll(`#${groupId} .seg-btn`);
    btns.forEach(btn => {
      btn.addEventListener('click', () => {
        btns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });
  }
  setupSeg('faseGroup');
  setupSeg('tomGroup');

  function getActive(groupId) {
    const btn = document.querySelector(`#${groupId} .seg-btn.active`);
    return btn ? btn.dataset.val : '';
  }

  async function gerarMensagem() {
    const fase = getActive('faseGroup');
    const tom  = getActive('tomGroup');
    const contexto = document.getElementById('contexto').value.trim();
    const trecho   = document.getElementById('trecho').value.trim();

    setLoading(true);
    setErro('');

    try {
      const res = await fetch('/api/generate-message', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          perfil_adicas: perfilAdicas,
          fase,
          tom,
          contexto_dela: contexto,
          trecho_conversa: trecho,
        }),
      });

      if (!res.ok) throw new Error('Erro na API');
      const data = await res.json();

      if (data.error) throw new Error(data.error);

      document.getElementById('msgTexto').textContent    = data.mensagem  || '—';
      document.getElementById('msgEstrutura').textContent = data.estrutura || '—';
      document.getElementById('msgMotivo').textContent   = data.motivo    || '—';
      document.getElementById('btnCopiar').textContent   = 'Copiar mensagem';
      document.getElementById('btnCopiar').classList.remove('copiado');

      document.getElementById('resultado').classList.add('visivel');
      document.getElementById('resultado').scrollIntoView({ behavior: 'smooth', block: 'start' });
    } catch (err) {
      setErro('Não foi possível gerar a mensagem. Verifique sua conexão e tente novamente.');
    } finally {
      setLoading(false);
    }
  }

  function copiarMensagem() {
    const texto = document.getElementById('msgTexto').textContent;
    navigator.clipboard.writeText(texto).then(() => {
      const btn = document.getElementById('btnCopiar');
      btn.textContent = '✓ Copiado!';
      btn.classList.add('copiado');
      setTimeout(() => {
        btn.textContent = 'Copiar mensagem';
        btn.classList.remove('copiado');
      }, 2000);
    });
  }

  function resetar() {
    document.getElementById('resultado').classList.remove('visivel');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function setLoading(on) {
    document.getElementById('loading').classList.toggle('visivel', on);
    document.getElementById('btnGerar').disabled = on;
    document.getElementById('resultado').classList.remove('visivel');
  }

  function setErro(msg) {
    const el = document.getElementById('erro');
    el.textContent = msg;
    el.classList.toggle('visivel', !!msg);
  }
</script>
</body>
</html>
